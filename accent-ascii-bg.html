<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accent + ASCII 呼吸场 · 可复用组件</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+SC:wght@200;300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    /* ===== 改这里换颜色 ===== */
    --accent: #86B932;
    --accent-rgb: 134,185,50;
    --accent-on: #0a0a0a;
    --ink: #0a0a0a;
    --paper: #fafaf8;
    --mono: "JetBrains Mono","IBM Plex Mono","SF Mono","Consolas",monospace;
    --sans: "Inter","Helvetica Neue","Helvetica","Arial",sans-serif;
    --sans-zh: "Noto Sans SC","PingFang SC","Microsoft YaHei UI","微软雅黑",sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ============================================================
     组件 1: 全屏 Accent 背景 + ASCII 呼吸场
     用法: <div class="accent-hero">...</div>
     ============================================================ */
  .accent-hero {
    width: 100vw;
    height: 100vh;
    background: var(--accent);
    color: var(--accent-on);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 5.6vh 5vw 4.4vh;
  }

  /* ASCII 呼吸场 canvas */
  .accent-hero canvas.ascii-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: screen;
    opacity: 0.92;
  }

  /* 内容层浮在 canvas 上方 */
  .accent-hero > *:not(canvas) {
    position: relative;
    z-index: 1;
  }

  /* ============================================================
     组件 2: 半屏 Accent + ASCII 呼吸场 (分屏左侧)
     用法: <div class="split-hero">
             <div class="half-accent">...</div>
             <div class="half-paper">...</div>
           </div>
     ============================================================ */
  .split-hero {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .half-accent {
    background: var(--accent);
    color: var(--accent-on);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 5.6vh 3.6vw 4.4vh;
  }

  .half-accent canvas.ascii-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: screen;
    opacity: 0.92;
  }

  .half-accent > *:not(canvas) {
    position: relative;
    z-index: 1;
  }

  .half-paper {
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    padding: 5.6vh 3.6vw 4.4vh;
  }

  /* ============================================================
     组件 3: 暗底 + Accent 高亮 (适合封面/章节页)
     用法: <div class="dark-hero">...</div>
     ============================================================ */
  .dark-hero {
    width: 100vw;
    height: 100vh;
    background: var(--ink);
    color: var(--paper);
    display: flex;
    flex-direction: column;
    padding: 5.6vh 5vw 4.4vh;
  }

  /* ===== 排版工具 ===== */
  .t-meta {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .accent-hero .t-meta { color: rgba(0,0,0,.78); }
  .half-accent .t-meta { color: rgba(0,0,0,.78); }

  .h-hero {
    font-family: var(--sans), var(--sans-zh);
    font-weight: 200;
    font-size: min(11.6vw, 19vh);
    line-height: 0.94;
    letter-spacing: -0.025em;
  }
  .lead {
    font-family: var(--sans), var(--sans-zh);
    font-weight: 400;
    font-size: max(18px, 1.08vw);
    line-height: 1.6;
    opacity: 0.86;
  }

  /* 分页提示 */
  .nav-hint {
    position: fixed;
    bottom: 2.4vh;
    right: 2.5vw;
    z-index: 30;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.4;
  }
</style>
</head>
<body>

<!-- ===== 演示 1: 全屏 Accent + ASCII 呼吸场 ===== -->
<div class="accent-hero">
  <canvas class="ascii-bg" aria-hidden="true"></canvas>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:48px">
    <div class="t-meta">DEMO · 全屏 Accent</div>
    <div class="t-meta">01 / 03</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center">
    <h1 class="h-hero" style="text-align:center">
      你的<br><span style="font-style:italic;font-weight:300">标题</span>
    </h1>
  </div>
  <div style="border-top:1px solid rgba(0,0,0,.22);padding-top:2vh;display:flex;justify-content:space-between">
    <div class="t-meta">副标题 · 日期 · 作者</div>
    <div class="t-meta">→ 键盘翻页</div>
  </div>
</div>

<!-- ===== 演示 2: 半屏 Accent + 白底 ===== -->
<div class="split-hero">
  <div class="half-accent">
    <canvas class="ascii-bg" aria-hidden="true"></canvas>
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div class="t-meta">DEMO · 半屏 Accent</div>
      <div class="t-meta">02 / 03</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vh">
      <div class="t-meta" style="letter-spacing:.22em">MANIFESTO</div>
      <h2 style="font-family:var(--sans),var(--sans-zh);font-size:min(8vw,14vh);line-height:.94;font-weight:200">
        左半<br><span style="font-style:italic;font-weight:300">宣言</span>
      </h2>
      <p style="font-size:max(14px,1vw);line-height:1.6;opacity:.82;max-width:36ch">
        这是左侧描述文字，用于承载核心宣言或金句。
      </p>
    </div>
    <div style="border-top:1px solid rgba(0,0,0,.22);padding-top:2vh" class="t-meta">
      签名 · 日期
    </div>
  </div>
  <div class="half-paper">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:48px">
      <div class="t-meta" style="color:var(--ink);opacity:.6">TAKEAWAYS</div>
      <div class="t-meta" style="color:var(--ink);opacity:.6">03 RULES</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:0">
      <div style="display:grid;grid-template-columns:auto 1fr;gap:2vw;align-items:start;padding:2.6vh 0;border-top:1px solid #e0e0e0">
        <div style="font-family:var(--sans);font-weight:200;font-size:min(4.4vw,7.8vh);line-height:.9">01</div>
        <div><h3 style="font-weight:400;font-size:max(18px,1.8vw);margin-bottom:1vh">要点一</h3><p style="font-size:max(16px,.94vw);line-height:1.6;opacity:.7">描述文字</p></div>
      </div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:2vw;align-items:start;padding:2.6vh 0;border-top:1px solid #e0e0e0">
        <div style="font-family:var(--sans);font-weight:200;font-size:min(4.4vw,7.8vh);line-height:.9">02</div>
        <div><h3 style="font-weight:400;font-size:max(18px,1.8vw);margin-bottom:1vh">要点二</h3><p style="font-size:max(16px,.94vw);line-height:1.6;opacity:.7">描述文字</p></div>
      </div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:2vw;align-items:start;padding:2.6vh 0;border-top:1px solid #e0e0e0;border-bottom:2px solid var(--accent)">
        <div style="font-family:var(--sans);font-weight:200;font-size:min(4.4vw,7.8vh);line-height:.9;color:var(--accent)">03</div>
        <div><h3 style="font-weight:400;font-size:max(18px,1.8vw);margin-bottom:1vh;color:var(--accent)">要点三 · 强调</h3><p style="font-size:max(16px,.94vw);line-height:1.6;opacity:.7">描述文字</p></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 演示 3: 暗底 + Accent 高亮 ===== -->
<div class="dark-hero">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:48px">
    <div class="t-meta" style="color:rgba(255,255,255,.62)">DEMO · 暗底封面</div>
    <div class="t-meta" style="color:rgba(255,255,255,.62)">03 / 03</div>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center">
    <h1 class="h-hero" style="text-align:center;color:#fff">
      暗底<br><span style="color:var(--accent);font-style:italic;font-weight:300">高亮</span>
    </h1>
  </div>
  <div style="border-top:1px solid rgba(255,255,255,.22);padding-top:2vh;display:flex;justify-content:space-between">
    <div class="t-meta" style="color:rgba(255,255,255,.6)">副标题 · 日期</div>
    <div class="t-meta" style="color:rgba(255,255,255,.6)">→ 键盘翻页</div>
  </div>
</div>

<div class="nav-hint">← → 翻页 · 滚轮翻页</div>

<!-- ============================================================
     ASCII 呼吸场引擎 (sin/cos 二维噪声场驱动字符显隐)
     自动扫描页面中所有 canvas.ascii-bg 并启动动画
     拷贝这段 <script> 到你的页面即可复用
     ============================================================ -->
<script>
(function(){
  const canvases = [...document.querySelectorAll('canvas.ascii-bg')];
  if(!canvases.length) return;

  const PALETTE = '   ...:::---+++***◦◦••▢▣';
  const CELL = 16;
  const FONT_SIZE = 13;

  function setup(c){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = c.getBoundingClientRect();
    if(rect.width < 4 || rect.height < 4) return false;
    c.width = Math.round(rect.width * dpr);
    c.height = Math.round(rect.height * dpr);
    c.__dpr = dpr;
    c.__w = rect.width;
    c.__h = rect.height;
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const mono = getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'JetBrains Mono, monospace';
    ctx.font = `500 ${FONT_SIZE}px ${mono}`;
    ctx.textBaseline = 'top';
    c.__ctx = ctx;
    return true;
  }

  function draw(c, t){
    if(!c.__ctx) return;
    const ctx = c.__ctx, w = c.__w, h = c.__h;
    ctx.clearRect(0, 0, w, h);
    const cols = Math.ceil(w / CELL);
    const rows = Math.ceil(h / CELL);
    for(let r = 0; r < rows; r++){
      for(let cc = 0; cc < cols; cc++){
        const n = (
          Math.sin(cc * 0.18 + t) +
          Math.sin(r * 0.24 - t * 0.7) +
          Math.sin((cc + r) * 0.12 + t * 0.45) +
          Math.sin(Math.hypot(cc - cols * 0.5, r - rows * 0.5) * 0.16 - t * 0.55)
        ) / 4;
        const v = (n + 1) / 2;
        if(v < 0.22) continue;
        const idx = Math.min(PALETTE.length - 1, Math.floor(v * PALETTE.length));
        const ch = PALETTE[idx];
        if(ch === ' ') continue;
        const alpha = 0.08 + (v - 0.22) * 0.55;
        ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(3)})`;
        ctx.fillText(ch, cc * CELL, r * CELL);
      }
    }
  }

  function resizeAll(){ canvases.forEach(setup); }

  let pending = null;
  window.addEventListener('resize', ()=>{
    if(pending) cancelAnimationFrame(pending);
    pending = requestAnimationFrame(resizeAll);
  }, {passive:true});

  let t0 = performance.now();
  let frame = 0, running = true;

  function tick(now){
    if(!running) return;
    const t = (now - t0) / 1000 * 0.55;
    frame++;
    canvases.forEach(c => {
      const rect = c.getBoundingClientRect();
      const onscreen = rect.bottom > 0 && rect.top < window.innerHeight;
      if(!onscreen && (frame & 3) !== 0) return;
      draw(c, t);
    });
    requestAnimationFrame(tick);
  }

  resizeAll();
  t0 = performance.now();
  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
